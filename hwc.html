<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Word Channel - No NonSense Gospel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: #f8fafc; 
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; 
            overflow: hidden;
            margin: 0; 
            padding: 0;
            height: 100vh;
        }
        
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.3);
        }
        
        /* Main Layout */
        .main-container {
            display: grid;
            height: 100vh;
            padding: 0.5rem;
            gap: 0.5rem;
            grid-template-columns: 1fr 260px;
            grid-template-rows: 1fr 2.2rem 2.2rem;
        }
        
        .video-area {
            grid-column: 1;
            grid-row: 1;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #000;
            min-height: 0;
            position: relative;
        }
        
        .video-area iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Video Controls Overlay */
        .video-controls {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            display: flex;
            gap: 0.4rem;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-area:hover .video-controls {
            opacity: 1;
        }
        .video-btn {
            padding: 0.5rem 0.7rem;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.4rem;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .video-btn:hover {
            background: rgba(59, 130, 246, 0.8);
        }
        
        /* Schedule Info Overlay */
        .schedule-info {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 10;
            padding: 0.5rem 0.75rem;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.4rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-area:hover .schedule-info {
            opacity: 1;
        }
        .schedule-info .current-mode {
            font-size: 0.9rem;
            font-weight: 600;
            color: #60a5fa;
        }
        .schedule-info .next-change {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }
        
        .sidebar {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 0;
            overflow: hidden;
        }
        
        .sidebar-card {
            border-radius: 0.6rem;
            padding: 0.6rem;
            flex-shrink: 0;
        }
        
        .weather-card {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        
        .news-row {
            grid-column: 1 / -1;
            border-radius: 0.4rem;
            overflow: hidden;
        }
        
        /* Clock */
        .compact-clock {
            text-align: center;
            padding: 0.5rem;
        }
        .compact-clock .time {
            font-size: 2.2rem;
            font-weight: bold;
            line-height: 1;
            letter-spacing: -1px;
        }
        .compact-clock .date {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }
        
        /* QR Code */
        .qr-section {
            text-align: center;
        }
        .qr-code {
            width: 120px;
            height: 120px;
            margin: 0 auto 0.4rem;
            background: white;
            padding: 0.25rem;
            border-radius: 0.4rem;
        }
        .qr-code img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .qr-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: #cbd5e1;
        }
        .qr-channel {
            font-size: 0.6rem;
            color: #94a3b8;
            margin-top: 0.15rem;
        }
        
        /* Weather */
        .weather-item {
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }
        .weather-item:last-child { border-bottom: none; }
        .weather-item .location { font-size: 0.75rem; font-weight: 600; color: #cbd5e1; }
        .weather-item .temp { font-size: 1.4rem; font-weight: bold; }
        .weather-item .desc { font-size: 0.65rem; color: #94a3b8; }
        .weather-item .details { font-size: 0.6rem; color: #64748b; margin-top: 0.15rem; }
        
        /* Currency */
        .currency-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
        }
        .currency-item {
            text-align: center;
            padding: 0.4rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 0.4rem;
        }
        .currency-item.alert {
            background: rgba(234, 179, 8, 0.2);
            border: 1px solid rgba(234, 179, 8, 0.5);
        }
        .currency-item .pair { font-size: 0.6rem; color: #94a3b8; }
        .currency-item .rate { font-size: 1rem; font-weight: bold; font-family: 'Courier New', monospace; }
        
        /* News Tickers */
        .ticker {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
        }
        .ticker-label {
            flex-shrink: 0;
            padding: 0.15rem 0.5rem;
            margin-left: 0.4rem;
            background: rgba(59, 130, 246, 0.3);
            border-radius: 0.2rem;
            font-size: 0.6rem;
            font-weight: 600;
            color: #93c5fd;
        }
        .ticker-scroll {
            flex: 1;
            overflow: hidden;
            margin-left: 0.6rem;
        }
        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: scroll-left 120s linear infinite;
        }
        .news-ticker-2 .ticker-content { animation-duration: 100s; }
        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .ticker-item {
            display: inline-block;
            margin-right: 2.5rem;
            font-size: 0.8rem;
        }
        .ticker-item::before {
            content: '•';
            color: #3b82f6;
            margin-right: 0.4rem;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 10px; }
        
        .loading {
            display: inline-block;
            width: 12px; height: 12px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Main Layout -->
    <div class="main-container">
        
        <!-- Large Video Area -->
        <div class="video-area glass" id="videoArea">
            
            <!-- YouTube Player Container -->
            <div id="ytPlayerContainer" style="width:100%; height:100%;"></div>
            
            <!-- Schedule Info (top-left, shows on hover) -->
            <div class="schedule-info" id="scheduleInfo">
                <div class="current-mode" id="currentMode">Loading...</div>
                <div class="next-change" id="nextChange"></div>
            </div>
            
            <!-- Video Controls (bottom-right, shows on hover) -->
            <div class="video-controls" id="videoControls">
                <button class="video-btn" onclick="ytPrevious()" title="Previous">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="video-btn" onclick="ytPlayPause()" id="playPauseBtn" title="Play/Pause">
                    <i class="fas fa-pause"></i>
                </button>
                <button class="video-btn" onclick="ytNext()" title="Next">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
        </div>
        
        <!-- Right Sidebar -->
        <div class="sidebar">
            <!-- Clock -->
            <div class="sidebar-card glass compact-clock">
                <div class="time" id="digitalClock">00:00</div>
                <div class="date" id="dateStr">Loading...</div>
            </div>
            
            <!-- QR Code -->
            <div class="sidebar-card glass qr-section">
                <div class="qr-code">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.youtube.com/@nononsensegospel" alt="QR Code">
                </div>
                <div class="qr-label">Scan to Subscribe</div>
                <div class="qr-channel">No NonSense Gospel</div>
            </div>
            
            <!-- Weather -->
            <div class="sidebar-card glass weather-card custom-scrollbar">
                <div id="weatherContainer">
                    <div class="text-center py-3"><div class="loading"></div></div>
                </div>
            </div>
            
            <!-- Currency -->
            <div class="sidebar-card glass">
                <div class="currency-grid" id="currencyList">
                    <div class="currency-item"><div class="loading"></div></div>
                </div>
            </div>
        </div>
        
        <!-- News Line 1 - Chinese -->
        <div class="news-row glass">
            <div class="ticker">
                <span class="ticker-label">中文</span>
                <div class="ticker-scroll">
                    <div class="ticker-content" id="news1Content">
                        <span class="ticker-item">Loading news...</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- News Line 2 - International -->
        <div class="news-row glass news-ticker-2">
            <div class="ticker">
                <span class="ticker-label">INTL</span>
                <div class="ticker-scroll">
                    <div class="ticker-content" id="news2Content">
                        <span class="ticker-item">Loading news...</span>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // ============================================
        // HYBRID CONFIG - Random Weekdays, Scheduled Weekends
        // ============================================
        
        const PLAYLISTS = {
            master: 'PL37_7-RvAesgsTr4HjLGXg44UBEWpx7gc',    // All sermons
            english: 'PL37_7-RvAesgJ0E_Wv9rq5LYInMpNQu0_',   // English only
            mandarin: 'PL37_7-RvAeshmEFAfH1T8jA-Lp3kGzfJx',  // Mandarin only
            cantonese: 'PL37_7-RvAesjrBipCCGSHM-ZnWxfVA-vZ'  // Cantonese only
        };
        
        const DEFAULT_NEWS1 = [
            { name: '明報', url: 'https://news.mingpao.com/rss/ins/s00005.xml' },
            { name: 'RTHK', url: 'https://rthk9.rthk.hk/rthk/news/rss/c_expressnews_clocal.xml' }
        ];
        
        const DEFAULT_NEWS2 = [
            { name: 'BBC', url: 'https://feeds.bbci.co.uk/news/rss.xml' },
            { name: 'RNZ', url: 'https://www.rnz.co.nz/rss/chinese.xml' }
        ];
        
        const config = {
            currentPlaylist: null,
            scheduledPlaylist: null,
            news1Feeds: [...DEFAULT_NEWS1],
            news2Feeds: [...DEFAULT_NEWS2],
            
            weatherLocations: [
                { label: 'Auckland', lat: -36.8485, lon: 174.7633 },
                { label: 'Botany', lat: -36.9167, lon: 174.9110 },
                { label: 'Hong Kong', lat: 22.3193, lon: 114.1694 }
            ],
            currencies: [
                { pair: 'NZD-USD', alert: 0.55, below: true },
                { pair: 'NZD-HKD', alert: 4.5, below: true }
            ]
        };

        // ============================================
        // HYBRID SCHEDULING LOGIC
        // ============================================
        
        function getScheduledPlaylist() {
            const now = new Date();
            const day = now.getDay(); // 0=Sunday, 6=Saturday
            const hours = now.getHours();
            const minutes = hours * 60 + now.getMinutes();
            
            // WEEKDAYS (Monday-Friday): Master playlist (random all sermons)
            if (day >= 1 && day <= 5) {
                return {
                    id: PLAYLISTS.master,
                    mode: 'Random All Sermons',
                    language: 'All Languages',
                    next: 'Saturday 12:00 AM'
                };
            }
            
            // SATURDAY SCHEDULE
            if (day === 6) {
                if (minutes < 720) { // Before 12:00 PM
                    return {
                        id: PLAYLISTS.mandarin,
                        mode: 'Weekend Schedule',
                        language: 'Mandarin (華語)',
                        next: '12:00 PM → Cantonese'
                    };
                }
                if (minutes < 1080) { // 12:00 PM - 6:00 PM
                    return {
                        id: PLAYLISTS.cantonese,
                        mode: 'Weekend Schedule',
                        language: 'Cantonese (廣東話)',
                        next: '6:00 PM → English'
                    };
                }
                // After 6:00 PM
                return {
                    id: PLAYLISTS.english,
                    mode: 'Weekend Schedule',
                    language: 'English',
                    next: 'Tomorrow 9:00 AM'
                };
            }
            
            // SUNDAY SCHEDULE
            if (day === 0) {
                if (minutes < 540) { // Before 9:00 AM
                    return {
                        id: PLAYLISTS.english,
                        mode: 'Weekend Schedule',
                        language: 'English',
                        next: '9:00 AM → Cantonese'
                    };
                }
                if (minutes < 810) { // 9:00 AM - 1:30 PM
                    return {
                        id: PLAYLISTS.cantonese,
                        mode: 'Weekend Schedule',
                        language: 'Cantonese (廣東話)',
                        next: '1:30 PM → Mandarin'
                    };
                }
                if (minutes < 1080) { // 1:30 PM - 6:00 PM
                    return {
                        id: PLAYLISTS.mandarin,
                        mode: 'Weekend Schedule',
                        language: 'Mandarin (華語)',
                        next: '6:00 PM → Random'
                    };
                }
                // After 6:00 PM: Back to master playlist
                return {
                    id: PLAYLISTS.master,
                    mode: 'Random All Sermons',
                    language: 'All Languages',
                    next: 'Monday'
                };
            }
        }
        
        function updateScheduleInfo() {
            const schedule = getScheduledPlaylist();
            document.getElementById('currentMode').textContent = schedule.language;
            document.getElementById('nextChange').textContent = `Next: ${schedule.next}`;
        }

        // YouTube Player
        let ytPlayer = null;
        let lastPlaylistId = null;

        // ============================================
        // UTILITIES
        // ============================================
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // YOUTUBE PLAYER
        // ============================================
        
        function onYouTubeIframeAPIReady() {
            const schedule = getScheduledPlaylist();
            config.currentPlaylist = schedule.id;
            config.scheduledPlaylist = schedule;
            lastPlaylistId = schedule.id;
            
            ytPlayer = new YT.Player('ytPlayerContainer', {
                height: '100%',
                width: '100%',
                playerVars: {
                    listType: 'playlist',
                    list: schedule.id,
                    autoplay: 1,
                    controls: 1,
                    rel: 0,
                    modestbranding: 1
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange
                }
            });
            
            updateScheduleInfo();
        }
        
        function onPlayerReady(event) {
            // Enable shuffle for randomization
            ytPlayer.setShuffle(true);
            // Wait for shuffle to take effect before playing
            setTimeout(() => {
                event.target.playVideo();
            }, 1500);
        }
        
        function onPlayerStateChange(event) {
            const btn = document.getElementById('playPauseBtn');
            if (event.data === YT.PlayerState.PLAYING) {
                btn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                btn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }
        
        // Check schedule every minute and switch playlists if needed
        function checkScheduleChange() {
            const schedule = getScheduledPlaylist();
            
            if (schedule.id !== lastPlaylistId) {
                console.log(`Schedule change detected: ${lastPlaylistId} → ${schedule.id}`);
                console.log(`New language: ${schedule.language}`);
                
                // Load new playlist
                if (ytPlayer && ytPlayer.loadPlaylist) {
                    ytPlayer.loadPlaylist({
                        listType: 'playlist',
                        list: schedule.id,
                        index: 0
                    });
                    ytPlayer.setShuffle(true);
                    ytPlayer.playVideo();
                }
                
                lastPlaylistId = schedule.id;
                config.currentPlaylist = schedule.id;
                config.scheduledPlaylist = schedule;
            }
            
            updateScheduleInfo();
        }
        
        function ytPlayPause() {
            if (!ytPlayer) return;
            const state = ytPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }
        
        function ytNext() {
            if (ytPlayer && ytPlayer.nextVideo) {
                ytPlayer.nextVideo();
            }
        }
        
        function ytPrevious() {
            if (ytPlayer && ytPlayer.previousVideo) {
                ytPlayer.previousVideo();
            }
        }

        // ============================================
        // CLOCK
        // ============================================
        
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('digitalClock').textContent = `${h}:${m}`;
            document.getElementById('dateStr').textContent = now.toLocaleDateString('zh-HK', { 
                month: 'short', day: 'numeric', weekday: 'short'
            });
        }

        // ============================================
        // WEATHER
        // ============================================
        
        async function fetchWeather() {
            const container = document.getElementById('weatherContainer');
            let html = '';
            
            for (const loc of config.weatherLocations) {
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code&hourly=uv_index&daily=precipitation_sum&forecast_days=2&timezone=auto`;
                    const resp = await fetch(url);
                    const data = await resp.json();
                    
                    const temp = Math.round(data.current.temperature_2m);
                    const desc = weatherCodeToText(data.current.weather_code);
                    
                    const now = new Date();
                    const times = (data.hourly?.time || []).map(t => new Date(t));
                    let uvIdx = 0;
                    for (let i = 0; i < times.length; i++) {
                        if (times[i] <= now) uvIdx = i;
                        else break;
                    }
                    const uv = data.hourly?.uv_index?.[uvIdx] || 0;
                    const rainTmr = data.daily?.precipitation_sum?.[1] || 0;
                    
                    const isHK = loc.label.includes('Hong Kong');
                    const details = isHK ? '' : `<div class="details">UV ${uv.toFixed(1)} · Tmr Rain ${rainTmr.toFixed(1)}mm</div>`;
                    
                    html += `
                        <div class="weather-item">
                            <div class="flex justify-between items-center">
                                <span class="location">${loc.label}</span>
                                <span class="temp">${temp}°</span>
                            </div>
                            <div class="desc">${desc}</div>
                            ${details}
                        </div>
                    `;
                } catch (e) {
                    console.error('Weather error:', loc.label, e);
                }
            }
            
            container.innerHTML = html || '<div class="text-red-400 text-xs">Weather error</div>';
        }
        
        function weatherCodeToText(code) {
            const codes = {
                0: 'Clear', 1: 'Mostly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
                45: 'Foggy', 48: 'Foggy', 51: 'Light Drizzle', 53: 'Drizzle', 55: 'Drizzle',
                61: 'Light Rain', 63: 'Rain', 65: 'Heavy Rain',
                80: 'Showers', 81: 'Showers', 82: 'Heavy Showers',
                95: 'Thunderstorm', 96: 'T-Storm'
            };
            return codes[code] || 'Unknown';
        }

        // ============================================
        // CURRENCY
        // ============================================
        
        async function fetchCurrencies() {
            const container = document.getElementById('currencyList');
            let html = '';
            
            for (const c of config.currencies) {
                try {
                    const [base, quote] = c.pair.split('-');
                    const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${base}`);
                    const data = await res.json();
                    
                    if (data.rates?.[quote]) {
                        const rate = data.rates[quote];
                        const isAlert = c.below ? rate < c.alert : rate > c.alert;
                        
                        html += `
                            <div class="currency-item ${isAlert ? 'alert' : ''}">
                                <div class="pair">${base}/${quote}</div>
                                <div class="rate">${rate.toFixed(4)}</div>
                            </div>
                        `;
                    }
                } catch (e) {
                    console.error('Currency error:', c.pair, e);
                }
            }
            
            container.innerHTML = html || '<div class="text-red-400 text-xs">Error</div>';
        }

        // ============================================
        // NEWS
        // ============================================
        
        async function fetchNews(feeds, containerId) {
            const container = document.getElementById(containerId);
            
            if (!feeds || !feeds.length) {
                container.innerHTML = '<span class="ticker-item">No feeds configured</span>';
                return;
            }
            
            let allNews = [];
            
            for (const feed of feeds) {
                try {
                    const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}&count=10`;
                    const res = await fetch(proxyUrl);
                    
                    if (!res.ok) continue;
                    
                    const data = await res.json();
                    
                    if (data.status === 'ok' && data.items && data.items.length) {
                        data.items.slice(0, 5).forEach(item => {
                            if (item.title) {
                                allNews.push(`[${feed.name}] ${item.title}`);
                            }
                        });
                    }
                } catch (e) {
                    console.error(`News error (${feed.name}):`, e);
                }
            }
            
            if (allNews.length > 0) {
                container.innerHTML = allNews.map(n => `<span class="ticker-item">${escapeHtml(n)}</span>`).join('');
            } else {
                container.innerHTML = '<span class="ticker-item">News temporarily unavailable</span>';
            }
        }

        // ============================================
        // INIT
        // ============================================
        
        function init() {
            updateClock();
            fetchWeather();
            fetchCurrencies();
            fetchNews(config.news1Feeds, 'news1Content');
            fetchNews(config.news2Feeds, 'news2Content');
            
            setInterval(updateClock, 1000);
            setInterval(checkScheduleChange, 60 * 1000); // Check schedule every minute
            setInterval(fetchWeather, 30 * 60 * 1000);
            setInterval(fetchCurrencies, 30 * 60 * 1000);
            setInterval(() => fetchNews(config.news1Feeds, 'news1Content'), 30 * 60 * 1000);
            setInterval(() => fetchNews(config.news2Feeds, 'news2Content'), 30 * 60 * 1000);
        }
        
        // Wait for page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Keep screen awake
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(e => console.log('Wake Lock:', e));
        }
    </script>
</body>
</html>
